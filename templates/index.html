<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>To-Do Manager</title>
<style>body{font-family:system-ui;max-width:760px;margin:2rem auto;padding:0 1rem}label{display:block;margin-top:.9rem;font-weight:600}input,textarea{box-sizing:border-box;width:100%;padding:.65rem;margin-top:.25rem}button{margin-top:1rem;padding:.7rem 1rem}pre{background:#f3f4f6;padding:1rem;white-space:pre-wrap;overflow-wrap:anywhere}</style></head>
<body><h1>To-Do Manager</h1><p>Add an item using its name and description. Your submission will be sent to the Flask backend.</p>
<form id="todo-form">
<label for="itemName">Item Name</label><input id="itemName" name="itemName" required maxlength="150">
<label for="itemDescription">Item Description</label><textarea id="itemDescription" name="itemDescription" required rows="4" maxlength="2000"></textarea>
<label for="itemId">Item ID</label><input id="itemId" name="itemId">
<button type="submit">Save To-Do</button></form><h2>Response</h2><pre id="response">Submit the form to see the response.</pre>
<script>
document.getElementById("todo-form").addEventListener("submit", async e => {
 e.preventDefault(); const payload=Object.fromEntries(new FormData(e.target).entries());
 try { const r=await fetch("/submittodoitem",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(payload)});
 document.getElementById("response").textContent=JSON.stringify(await r.json(),null,2);
 } catch(err) { document.getElementById("response").textContent="Request failed: "+err.message; }
});
</script></body></html>
